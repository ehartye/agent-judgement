  .bar { position: relative; height: 10px; background: var(--rule); border-radius: 99px; margin: 8px 0 6px; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--ink); border-radius: 99px; }
  .fig { font-family: var(--figures); font-size: 16px; }
  .state { font: 600 13px/1 var(--display); padding: 3px 8px 4px; border-radius: 3px; background: var(--ink); color: var(--sheet); white-space: nowrap; }
  .state.standing { background: var(--l2); }

  details { margin-top: 44px; background: var(--sheet); border-radius: 4px; padding: 14px 18px; }

  .pick { display: inline-block; background: var(--ink); color: var(--sheet); font: 500 18px/1 var(--display); padding: 15px 22px; border-radius: 4px; cursor: pointer; }

  .foot { margin-top: 40px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; color: var(--soft); font-size: 15px; }

<script>
(() => {
  const app = document.getElementById('app');
  const LINES = ['--l1', '--l2', '--l3', '--l4', '--l5', '--l6'];
  const STAGES = ['frame', 'lean', 'widen', 'weigh', 'test', 'commit', 'return'];
  const NAMES = { frame: 'Frame', lean: 'Lean', widen: 'Widen', weigh: 'Weigh', test: 'Test', commit: 'Commit', return: 'Return' };
  const SVG = 'http://www.w3.org/2000/svg';

  // Every string reaches the page as text, never as markup.
  const el = (tag, props = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null) continue;

  const s = (tag, props = {}, text) => {

    return n;
  };
  const list = (v) => Array.isArray(v) ? v : [];
  const pct = (p) => Math.round(p * 100) + '%';
  const day = (d) => {
    if (!d) return '';
    const [y, m, q] = String(d).slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, q).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  };
  const clip = (t, n) => { t = String(t); return t.length > n ? t.slice(0, n - 1).trimEnd() + '…' : t; };
  const wrap = (t, n, max) => {
    const out = ['']; for (const w of String(t).split(/\s+/)) {
      const last = out.length - 1;
      if ((out[last] + ' ' + w).trim().length <= n) out[last] = (out[last] + ' ' + w).trim(); else out.push(w);
    }
    if (out.length > max) { out.length = max; out[max - 1] = clip(out[max - 1] + ' …', n); }
    return out;
  };

  function reached(d) {
    let at = 0;
    for (const e of list(d.events)) at = Math.max(at, STAGES.indexOf(e.stage));
    if (d.decision) at = Math.max(at, 5);
    if (d.review && d.review.doneAt) at = 6;

  // The signature: options are lines, stages are stations. A line ends where its option was set aside.
  function routeMap(d, color) {
    const opts = list(d.options), W = 1180, left = 96, right = 250, top = 74, gap = 62;
    const H = top + Math.max(1, opts.length) * gap + 34;
    const x = (i) => left + i * ((W - left - right) / (STAGES.length - 1));
    const mid = top + ((Math.max(1, opts.length) - 1) * gap) / 2;
    const at = reached(d);
    const root = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': label(d) });

      root.append(s('line', { x1: x(i), x2: x(i), y1: 48, y2: H - 18, stroke: 'var(--rule)', 'stroke-width': 1.5 }));

    });

      const end = o.state === 'set-aside' ? Math.max(from, STAGES.indexOf(o.leftAt || 'weigh')) : Math.max(from, chosen ? Math.max(5, Math.min(at, 6)) : Math.min(at, 5));
      const bx = x(from) - 18, start = from > 1 ? x(from) - 78 : x(1);
      const path = `M ${start} ${mid} C ${start + 46} ${mid}, ${bx - 18} ${y}, ${x(from) + (from > 1 ? 0 : 60)} ${y} L ${x(Math.max(end, from)) + (end === from ? 60 : 0)} ${y}`;
      if (from > 1) root.append(s('line', { x1: x(1), x2: start, y1: mid, y2: mid, stroke: 'var(--ink)', 'stroke-width': 7, 'stroke-linecap': 'round' }));

      for (let i = from + 1; i < end; i++) root.append(s('circle', { cx: x(i), cy: y, r: 6, fill: 'var(--sheet)', stroke: c, 'stroke-width': 3.5 }));
      if (o.state === 'set-aside') root.append(s('line', { x1: ex, x2: ex, y1: y - 15, y2: y + 15, stroke: c, 'stroke-width': 7, 'stroke-linecap': 'round' }));
      else root.append(s('circle', { cx: ex, cy: y, r: chosen ? 12 : 8, fill: chosen ? c : 'var(--sheet)', stroke: chosen ? 'var(--sheet)' : c, 'stroke-width': 4 }));
      const obj = list(d.objections).filter((q) => q.against === o.id);
      obj.forEach((q, i) => {
        const cx = x(4) - 22 + i * 22;
        if (STAGES.indexOf('test') <= end) root.append(s('circle', { cx, cy: y, r: 8, fill: q.state === 'standing' ? 'var(--l2)' : 'var(--sheet)', stroke: 'var(--ink)', 'stroke-width': 3 }));
      });
      const tx = o.state === 'set-aside' ? ex + 18 : (chosen ? x(6) + 24 : ex + 22);
      const lines = wrap(o.name, o.state === 'set-aside' && end < 5 ? 30 : 24, 2);

      lines.forEach((t, i) => root.append(s('text', { x: tx, y: y + back + i * 20, 'font-size': chosen ? 19 : 17, 'font-weight': chosen ? 700 : 500, fill: 'var(--ink)', 'paint-order': 'stroke', stroke: 'var(--sheet)', 'stroke-width': 6, 'stroke-linejoin': 'round' }, t)));
    });
    root.append(s('circle', { cx: x(0), cy: mid, r: 13, fill: 'var(--sheet)', stroke: 'var(--ink)', 'stroke-width': 6 }));
    root.append(s('circle', { cx: x(1), cy: mid, r: 8, fill: 'var(--sheet)', stroke: 'var(--ink)', 'stroke-width': 4 }));

  }

  }

  function render(d) {

    const opts = list(d.options), byId = Object.fromEntries(opts.map((o) => [o.id, o]));
    const color = (id) => { const i = opts.findIndex((o) => o.id === id); return i < 0 ? 'var(--soft)' : `var(${LINES[i % LINES.length]})`; };
    const name = (id) => byId[id] ? byId[id].name : id;

    if (dec) { add('Chosen', name(dec.choice)); add('By', list(dec.by).join(', ')); add('Grounds', ({ strong: 'Strong', fair: 'Fair', thin: 'Thin' })[dec.basis]); add('Looks again on', day(d.review && d.review.on), 'num'); }
    else if (d.status === 'evidence-needed') { add('Where it stands', 'Evidence first'); add('Missing', list(d.knowable && d.knowable.missing).join('; ')); add('Decide by', day(f.decideBy), 'num'); }
    else { add('Where it stands', NAMES[STAGES[reached(d)]]); add('Decide by', day(f.decideBy), 'num'); add('To undo it', ({ easy: 'Easy', costly: 'Costly', permanent: 'Permanent' })[f.undo && f.undo.class]); }
    out.push(el('header', { class: 'head' },
      el('div', {}, el('p', { class: 'where' }, d.title || ''), el('h1', {}, f.question || d.title || 'Untitled decision'), f.whyNow ? el('p', { class: 'why' }, f.whyNow) : null), ticket));

    if (opts.length) out.push(el('figure', { class: 'map', tabindex: '0', 'aria-label': 'Route map, scrolls sideways on small screens' }, routeMap(d, color)));

    if (dec) out.push(el('section', {}, el('h2', {}, 'Why'), el('div', { class: 'grid2' },
      el('div', {}, el('p', {}, dec.reason), dec.givingUp ? el('p', { class: 'small', style: 'margin-top:10px' }, 'Giving up: ' + dec.givingUp) : null),
      el('div', {}, dec.firstStep ? el('p', {}, 'First step: ' + dec.firstStep) : null, dec.keepReversible ? el('p', { class: 'small', style: 'margin-top:10px' }, 'Kept open: ' + dec.keepReversible) : null, dec.riskOwner ? el('p', { class: 'small' }, 'Owns what could still go wrong: ' + dec.riskOwner) : null))));
    if (d.authorityGap) out.push(el('section', {}, el('h2', {}, 'Nobody here can commit this yet'), el('p', {}, d.authorityGap)));

    if (list(d.takes).length) out.push(el('section', {}, el('h2', {}, 'Where each person stood'), el('div', { class: 'takes' }, d.takes.map((t) => {
      const hit = opts.find((o) => o.id === t.leaning || o.name.toLowerCase() === String(t.leaning).toLowerCase());
      return el('div', { class: 'take', color: hit ? color(hit.id) : null },
        el('p', { class: 'small' }, `${t.who}, ${t.when === 'final' ? 'at the end' : 'at the start'}`),
        el('b', {}, hit ? hit.name : t.leaning), el('div', { class: 'bar', role: 'img', 'aria-label': pct(t.probability) + ' sure' }, el('i', { style: `width:${pct(t.probability)}` })),
        el('p', { class: 'small' }, `${pct(t.probability)} sure. ${t.why}`));
    }))));

    if (list(d.criteria).length && list(d.ratings).length) {
      const crit = [...d.criteria].sort((a, b) => (a.order || 99) - (b.order || 99));
      out.push(el('section', {}, el('h2', {}, 'What mattered, most important first'), el('div', { class: 'scroll' }, el('table', {},
        el('thead', {}, el('tr', {}, el('th', { scope: 'col' }, ''), opts.map((o) => el('th', { scope: 'col', style: `color:${color(o.id)}`, class: o.state === 'set-aside' ? 'out' : null }, o.name)))),
        el('tbody', {}, crit.map((c) => el('tr', {}, el('th', { scope: 'row' }, c.text, c.kind === 'must' ? el('span', { class: 'must' }, 'must') : null),
          opts.map((o) => { const r = list(d.ratings).find((q) => q.option === o.id && q.criterion === c.id);
            return el('td', { color: color(o.id), class: o.state === 'set-aside' ? 'out' : null }, r ? [el('div', { class: 'pips', role: 'img', 'aria-label': r.score + ' out of 5' }, [1, 2, 3, 4, 5].map((i) => el('i', { class: i <= r.score ? 'on' : null }))), el('span', { class: 'small' }, r.because)] : el('span', { class: 'small' }, 'Not rated')); }))))))));
    }

    const ev = list(d.evidence), kinds = [['fact', 'Known'], ['inference', 'Worked out'], ['assumption', 'Assumed'], ['unknown', 'Not known']];
    const evBox = ev.length ? el('div', {}, el('h2', {}, 'What it rests on'), kinds.map(([k, title]) => { const items = ev.filter((e) => e.kind === k); return items.length ? [el('h3', { class: 'kind' }, title), items.map((e) => el('div', { class: 'row' }, el('b', {}, e.text),
      el('p', { class: 'small' }, [e.source, e.strength ? e.strength[0].toUpperCase() + e.strength.slice(1) + ' evidence' : null, e.ifWrong ? 'If wrong: ' + e.ifWrong : null].filter(Boolean).join('. ')),
      list(e.bears).length ? el('p', { class: 'bears' }, e.bears.map((b) => el('span', { color: color(b.option) }, `${b.way === 'for' ? 'For' : 'Against'} ${name(b.option)}`))) : null))] : null; })) : null;
    const ob = list(d.objections), tens = list(d.tensions), fs = list(d.failureStories);
    const obBox = ob.length || tens.length || fs.length ? el('div', {}, el('h2', {}, 'What was said against it'),
      ob.map((o) => el('div', { class: 'row' }, el('b', {}, o.text), el('p', { class: 'small' }, el('span', { class: 'state ' + o.state }, ({ standing: 'Still standing', answered: 'Answered', 'changed-the-choice': 'Changed the choice' })[o.state]), ` ${o.from}${o.against ? ', on ' + name(o.against) : ''}. ${o.settledBy ? o.settledBy : o.cheapestTest ? 'Cheapest test: ' + o.cheapestTest : ''}`))),
      tens.length ? el('h3', { class: 'kind' }, 'Where two aims pulled apart') : null,
      tens.map((t) => el('div', { class: 'row' }, el('b', {}, list(t.between).map((id) => (list(d.criteria).find((c) => c.id === id) || { text: id }).text).join(' against ')), el('p', { class: 'small' }, [t.real ? t.evidence : 'Not a real conflict.', t.result, t.gaveUp ? 'Gave up: ' + t.gaveUp : null].filter(Boolean).join(' ')))),
      fs.length ? el('h3', { class: 'kind' }, 'If it fails, this is how') : null,
      fs.map((q) => el('div', { class: 'row' }, el('b', {}, q.story), el('p', { class: 'small' }, [q.firstSign ? 'First sign: ' + q.firstSign : null, q.guard ? 'Guard: ' + q.guard : null].filter(Boolean).join(' '))))) : null;
    if (evBox || obBox) out.push(el('section', { class: 'grid2' }, evBox, obBox));

    if (d.outsideView && d.outsideView.whatHappened) out.push(el('section', {}, el('h2', {}, 'How cases like this usually go'), el('p', { style: 'max-width:70ch' }, `${d.outsideView.similarCases}. ${d.outsideView.whatHappened}`), d.outsideView.source ? el('p', { class: 'small' }, d.outsideView.source) : null));

    const need = list(d.knowable && d.knowable.plan);
    if (need.length) out.push(el('section', {}, el('h2', {}, 'What to find out first'), need.map((p) => el('div', { class: 'row' }, el('b', {}, p.find), el('p', { class: 'small' }, [p.how, p.owner, p.by ? 'by ' + day(p.by) : null].filter(Boolean).join(', '))))));

    const fc = list(d.forecasts), re = list(d.reopenIf);
    if (fc.length || re.length) out.push(el('section', { class: 'grid2' },
      fc.length ? el('div', {}, el('h2', {}, 'What we expect'), fc.map((q) => el('div', { class: 'row' }, el('b', {}, q.claim), el('div', { class: 'bar', role: 'img', 'aria-label': pct(q.probability) }, el('i', { style: `width:${pct(q.probability)}` })), el('p', { class: 'small' }, el('span', { class: 'fig' }, pct(q.probability)), ` ${q.by ? q.by + ', ' : ''}check ${day(q.checkOn)}. ${q.howWeWillKnow}`, q.cameTrue == null ? '' : q.cameTrue ? ' It came true.' : ' It did not.')))) : null,
      re.length ? el('div', {}, el('h2', {}, 'What would reopen it'), re.map((q) => el('div', { class: 'row' }, el('b', {}, q.sign), el('p', { class: 'small' }, q.seen ? `Seen: ${q.seen}` : `${q.watcher} is watching`)))) : null));

    const parts = list(d.map && d.map.parts), links = list(d.map && d.map.links);
    if (parts.length) { const nm = Object.fromEntries(parts.map((p) => [p.id, p.name]));
      out.push(el('section', { class: 'grid2' }, el('div', {}, el('h2', {}, 'What it sits inside'), parts.map((p) => el('div', { class: 'row' }, el('b', {}, p.name), p.wants ? el('p', { class: 'small' }, 'Wants: ' + p.wants) : null))),
