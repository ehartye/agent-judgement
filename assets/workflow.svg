<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1560" role="img" aria-labelledby="t d" font-family="'Gill Sans Nova','Gill Sans','Gill Sans MT','Trebuchet MS',sans-serif">
  <title id="t">The seven stages of a decision</title>
  <desc id="d">A route map read from top to bottom. One: Frame, ask the right question. Two: Lean, write your view first and alone. Three: Widen, set what matters, then open up the options. Four: Weigh, sort the evidence and rate one thing at a time. Five: Test, try to break the favourite. Six: Commit, people choose with a forecast. Seven: Return, come back and mark it. Lines for each option branch at Widen and end where the option is set aside; one line reaches Commit. A dashed line runs from Return back to Frame when a reopening sign appears.</desc>
  <rect width="1200" height="1560" rx="10" fill="#e6ecee"/>

  <text x="60" y="84" font-size="46" font-weight="500" fill="#10243a">How a decision gets made here</text>
  <text x="60" y="122" font-size="22" fill="#506274">Each coloured line is an option. A line ends where that option is set aside.</text>

  <!-- tracks -->
  <g fill="none" stroke-linecap="round">
    <path d="M176 240 V524" stroke="#10243a" stroke-width="11"/>
    <path d="M176 520 C176 585 70 560 70 640 V820" stroke="#1f5fbf" stroke-width="9"/>
    <path d="M176 520 C176 585 140 575 140 640 V1005" stroke="#cf4128" stroke-width="9"/>
    <path d="M176 520 C176 585 282 560 282 640 V820" stroke="#7a3f91" stroke-width="9"/>
    <path d="M176 520 C176 585 212 575 212 640 V1060 C212 1130 176 1120 176 1190 V1215" stroke="#24855a" stroke-width="13"/>
    <path d="M176 1225 V1390" stroke="#24855a" stroke-width="8" stroke-dasharray="1 17"/>
    <path d="M160 1412 C20 1412 24 1330 24 1240 V420 C24 280 40 246 150 240" stroke="#506274" stroke-width="4" stroke-dasharray="3 11"/>
    <path d="M136 230 L152 240 L137 251" stroke="#506274" stroke-width="4"/>
  </g>
  <!-- ends of the line -->
  <g stroke-width="11" stroke-linecap="round">
    <path d="M50 822 H90" stroke="#1f5fbf"/><path d="M262 822 H302" stroke="#7a3f91"/><path d="M120 1007 H160" stroke="#cf4128"/>
  </g>
  <!-- objections -->
  <g stroke="#10243a" stroke-width="4"><circle cx="212" cy="985" r="10" fill="#f8fafa"/><circle cx="212" cy="1012" r="10" fill="#cf4128"/></g>

  <!-- stations -->
  <g fill="#f8fafa" stroke="#10243a" stroke-width="8">
    <circle cx="176" cy="240" r="21"/><circle cx="176" cy="425" r="15"/>
    <circle cx="70" cy="640" r="11" stroke="#1f5fbf"/><circle cx="140" cy="640" r="11" stroke="#cf4128"/><circle cx="212" cy="640" r="12" stroke="#24855a"/><circle cx="282" cy="640" r="11" stroke="#7a3f91"/>
    <circle cx="140" cy="820" r="11" stroke="#cf4128"/><circle cx="212" cy="820" r="12" stroke="#24855a"/>
  </g>
  <circle cx="176" cy="1215" r="22" fill="#24855a" stroke="#f8fafa" stroke-width="6"/>
  <circle cx="176" cy="1412" r="19" fill="#f8fafa" stroke="#24855a" stroke-width="8"/>

  <!-- words -->
  <g fill="#10243a">
    <g font-size="34" font-weight="600">
      <text x="350" y="232" fill="#506274">1</text><text x="384" y="232">Frame</text><text x="350" y="417" fill="#506274">2</text><text x="384" y="417">Lean</text><text x="350" y="612" fill="#506274">3</text><text x="384" y="612">Widen</text><text x="350" y="797" fill="#506274">4</text><text x="384" y="797">Weigh</text><text x="350" y="982" fill="#506274">5</text><text x="384" y="982">Test</text><text x="350" y="1187" fill="#506274">6</text><text x="384" y="1187">Commit</text><text x="350" y="1392" fill="#506274">7</text><text x="384" y="1392">Return</text>
    </g>
    <g font-size="24" font-weight="500">
      <text x="350" y="268">Ask the right question.</text>
      <text x="350" y="453">Write your view first, alone.</text>
      <text x="350" y="648">Set what matters, then open up.</text>
      <text x="350" y="833">Rate one thing at a time.</text>
      <text x="350" y="1018">Try to break the favourite.</text>
      <text x="350" y="1223">People choose, with a forecast.</text>
      <text x="350" y="1428">Come back and mark it.</text>
    </g>
    <g font-size="20" fill="#506274">
      <text x="350" y="300">What happened? What are we choosing?</text><text x="350" y="327">Who decides? Can anyone know the answer?</text>
      <text x="350" y="485">Where you lean and how sure you are,</text><text x="350" y="512">before hearing anyone, the model included.</text>
      <text x="350" y="680">What a good choice must do, in order.</text><text x="350" y="707">At least four options, one is do nothing yet.</text>
      <text x="350" y="865">Known, worked out, assumed, not known.</text><text x="350" y="892">How did it go for others?</text>
      <text x="350" y="1050">Both sides of every option. Is the conflict real?</text><text x="350" y="1077">A year from now it failed: how?</text>
      <text x="350" y="1255">What it costs, what we expect,</text><text x="350" y="1282">and what would reopen it.</text>
      <text x="350" y="1460">What happened, how well it was decided,</text><text x="350" y="1487">and what was luck.</text>
    </g>
  </g>

  <!-- what you leave with -->
  <g>
    <g fill="#f8fafa">
      <path d="M830 200 h310 v112 a22 22 0 0 1 -22 22 h-288 z"/><path d="M830 385 h310 v112 a22 22 0 0 1 -22 22 h-288 z"/><path d="M830 580 h310 v112 a22 22 0 0 1 -22 22 h-288 z"/><path d="M830 765 h310 v112 a22 22 0 0 1 -22 22 h-288 z"/><path d="M830 950 h310 v112 a22 22 0 0 1 -22 22 h-288 z"/><path d="M830 1360 h310 v112 a22 22 0 0 1 -22 22 h-288 z"/>
    </g>
    <path d="M830 1155 h310 v132 a22 22 0 0 1 -22 22 h-288 z" fill="#10243a"/>
    <g font-size="17" font-weight="600" fill="#506274">
      <text x="854" y="234">You leave with</text><text x="854" y="419">You leave with</text><text x="854" y="614">You leave with</text><text x="854" y="799">You leave with</text><text x="854" y="984">You leave with</text><text x="854" y="1189" fill="#c3ced4">You leave with</text><text x="854" y="1394">You leave with</text>
    </g>
    <g font-size="23" font-weight="500" fill="#10243a">
      <text x="854" y="268">One question everyone</text><text x="854" y="297">agrees is the question</text>
      <text x="854" y="453">A view and a percentage</text><text x="854" y="482">from each person</text>
      <text x="854" y="648">Ordered criteria, and</text><text x="854" y="677">four to six options</text>
      <text x="854" y="833">A table you can read,</text><text x="854" y="862">with no grand total</text>
      <text x="854" y="1018">Objections answered,</text><text x="854" y="1047">or still standing</text>
      <text x="854" y="1223" fill="#f8fafa">A choice and a review date,</text><text x="854" y="1252" fill="#f8fafa">or a plan to find out first</text>
      <text x="854" y="1428">A score, and one thing</text><text x="854" y="1457">to keep for next time</text>
    </g>
  </g>
  <text x="60" y="1532" font-size="18" fill="#506274">The dashed line back to the top: a reopening sign was seen.</text>
</svg>
